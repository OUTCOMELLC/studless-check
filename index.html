.app{display:grid;grid-template-columns:420px 1fr;grid-template-rows:100%;height:100%}
.panel{min-height:0}
.panel{padding:20px 22px 28px;overflow-y:auto;border-inline-end:1px solid var(--line);background:var(--surface)}
.mapwrap{position:relative;min-height:60vh}
#map{position:absolute;inset:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top img{flex:none;display:block}
.top .grow{flex:1;min-width:0}
h1{font-size:1.45rem;font-weight:900;line-height:1.15;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--muted);letter-spacing:0}
select{font:inherit;font-size:.85rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:9.5rem}
p.lede{margin:0 0 18px;color:var(--muted);font-size:.95rem}
label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 4px}
.hint{font-weight:400;color:var(--muted)}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.quick button{font:inherit;font-size:.85rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--chip);color:var(--ink);cursor:pointer}
.quick button:hover{border-color:var(--navy)}
.jptime{font-size:.8rem;color:var(--muted);margin-top:6px}
.weeks{margin-inline-start:auto;font-size:.85rem;font-weight:700;color:var(--navy)}
@media (prefers-color-scheme:dark){.weeks{color:var(--gold)}}
.actions{display:flex;gap:8px;margin-top:16px}
button.reset{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
button.reset:hover{border-color:var(--navy)}
.inwrap{position:relative}
.inwrap input{padding-inline-end:38px}
.clr{position:absolute;inset-inline-end:7px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:50%;background:var(--chip);color:var(--muted);cursor:pointer;font-size:1.05rem;line-height:1;padding:0}
.clr:hover{color:var(--ink)}
.clr[hidden]{display:none}
button.go{flex:1;font:inherit;font-weight:700;padding:12px;border:0;border-radius:8px;background:var(--orange);color:#fff;cursor:pointer}
button.go:disabled{opacity:.6;cursor:wait}
.err{color:var(--red);font-size:.9rem;margin-top:10px;min-height:1em}

/* The road sign: the one bold element */
.sign{margin:22px 0 14px;background:var(--sign-bg);color:var(--sign-ink);border-radius:10px;padding:5px}
.sign-inner{border:2px solid var(--sign-ink);border-radius:7px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.lamp{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--sign-ink)}
.sign .sub{font-size:.85rem;opacity:.85}
.sign .main{font-size:1.4rem;font-weight:900;line-height:1.15}
.l2 .lamp{background:var(--red)} .l1 .lamp{background:var(--amber)} .l0 .lamp{background:var(--green)}
.haz{border-inline-start:4px solid var(--gold);background:var(--chip);border-radius:6px;padding:8px 12px;margin:0 0 14px;font-size:.9rem}
.haz h2{margin:0 0 4px;font-size:.95rem}
.haz ul{margin:0;padding-inline-start:1.1em}
.haz.ok{border-inline-start-color:var(--green)}
.reasons{margin:0 0 14px;padding-inline-start:1.1em;font-size:.93rem}
.reasons li{margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:end;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:start}
td:not(:first-child){white-space:nowrap}
th{font-weight:700;color:var(--muted)}
tr.wk td{font-weight:700;color:var(--navy);background:var(--chip);border-bottom:0;padding-top:4px;padding-bottom:4px}
@media (prefers-color-scheme:dark){tr.wk td{color:var(--gold)}}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle}
.d2{background:var(--red)}.d1{background:var(--amber)}.d0{background:var(--green)}.dn{background:var(--grey)}
.sq{display:inline-block;width:10px;height:10px;background:var(--gold);border:1.5px solid var(--navy);vertical-align:middle}
.dia{display:inline-block;width:9px;height:9px;background:var(--navy);border:1.5px solid #fff;outline:1px solid var(--navy);transform:rotate(45deg);vertical-align:middle}
.lgsw{display:flex;gap:6px;align-items:center;cursor:pointer;font-weight:700;margin:2px 0}
.lgsw input{width:16px;height:16px;margin:0;accent-color:var(--orange)}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin-top:14px;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--orange)}
select.wide{width:100%;max-width:none;padding:10px 12px;font-size:1rem}
.obs{font-size:.8rem;color:var(--red);font-weight:700}
.profile{margin:4px 0 14px}
.profile svg{width:100%;height:auto;display:block}
.pf-area{fill:var(--chip);stroke:var(--navy);stroke-width:1.5}
.pf-grid{stroke:var(--line);stroke-width:1}
.pf-ax{fill:var(--muted);font-size:9px}
.pf-lbl{fill:var(--ink);font-size:10px;font-weight:700}
.pf-dot{stroke:#fff;stroke-width:1.5}
.pf-d2{fill:var(--red)}.pf-d1{fill:var(--amber)}.pf-d0{fill:var(--green)}
@media (prefers-color-scheme:dark){.pf-area{stroke:var(--gold)}}
.tri{display:inline-block;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--orange);vertical-align:middle}
h3{font-size:1rem;margin:18px 0 6px}
.place{font-size:.9rem;color:var(--muted);margin:2px 0 8px}
footer{margin-top:22px;font-size:.78rem;color:var(--muted)}
footer a{color:inherit}
.legend{position:absolute;z-index:500;inset-inline-start:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem;line-height:1.75}
.mapnote{position:absolute;z-index:500;inset-inline-start:56px;top:10px;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.78rem;max-width:calc(100% - 130px)}
.tsu{position:absolute;z-index:600;inset-inline:56px 56px;top:52px;background:var(--red);color:#fff;border-radius:8px;padding:8px 12px;font-size:.88rem;font-weight:700;display:none}
.leaflet-popup-content{font-family:inherit}
.popbtn{margin-top:6px;font:inherit;font-size:.8rem;padding:4px 8px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;cursor:pointer}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto;height:auto}
  .panel{overflow:visible}
  .panel{border-inline-end:0;border-bottom:1px solid var(--line)}
  .mapwrap{height:70vh}
}
.datewrap{position:relative}
.datebtn{width:100%;font:inherit;text-align:start;padding:10px 10px;white-space:nowrap;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:46px}
.datebtn .cw{font-size:.72rem;font-weight:700;color:var(--navy);white-space:nowrap}
.cal{position:absolute;z-index:1000;top:calc(100% + 4px);width:min(268px,calc(100vw - 40px));font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px}
.cal[hidden]{display:none}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;font-weight:700;font-size:.85rem}
.cal-h button{font:inherit;font-size:.95rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;width:26px;height:26px;cursor:pointer;line-height:1}
.cal table{width:100%;border-collapse:collapse;font-size:.78rem;table-layout:fixed}
.cal th,.cal td{text-align:center;padding:1px;border:0;white-space:normal}
.cal th{color:var(--muted);font-weight:700;font-size:.66rem}
.cal td.cw,.cal th.cw{color:var(--navy);font-size:.62rem;font-weight:700;border-inline-end:1px solid var(--line);width:12%}
.cal td button{width:100%;height:26px;font:inherit;border:0;border-radius:6px;background:none;color:var(--ink);cursor:pointer;padding:0}
.cal td button:hover{background:var(--chip)}
.cal td button.out{color:var(--muted)}
.cal td button.inr{background:var(--chip)}
.cal td button.sel{background:var(--orange);color:#fff;font-weight:700}
.cal td button.today{box-shadow:inset 0 0 0 2px var(--navy)}
.cal-f{margin-top:4px;font-size:.72rem;color:var(--muted);text-align:center}
.cal td button:disabled{opacity:.3;cursor:not-allowed;background:none}
@media (prefers-color-scheme:dark){.datebtn .cw,.cal td.cw,.cal th.cw{color:var(--gold)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function passesBetween(a,b,radius=25){

  const ax=X(a),ay=Y(a),dx=X(b)-ax,dy=Y(b)-ay,L2=dx*dx+dy*dy;

    const ex=ax+u*dx-X(p), ey=ay+u*dy-Y(p); return Math.hypot(ex,ey)<=radius?{p,u}:null})
   .filter(Boolean).sort((x,y)=>x.u-y.u).slice(0,4).map(x=>x.p);
}

    for(const p of passesBetween(pos(u),pos(v),15)) if(!passes.includes(p)){
      passes.push(p); const q={lat:p.lat,lon:p.lon,pass:p};

function seasonLevel(zone,month){

  if(zone==="mountain") return [11,12,1,2,3,4].includes(month)?1:0;

}
function dayLevel(tmin,snow,precip){

const FC_URL="https://api.open-meteo.com/v1/forecast?daily=temperature_2m_min,snowfall_sum,precipitation_sum&timezone=Asia%2FTokyo&forecast_days=16";
/* Forecasts are cached for 1 hour (memory + this browser), so changing dates, languages or
   reloading the page does not call the free weather service again. Each location in a request
   counts against Open-Meteo's free limits (per minute / hour / day), so repeat calls add up fast. */
const FC_TTL=36e5, FC_MEM={};
async function forecast(lats,lons){
  const url=FC_URL+"&latitude="+lats.join(",")+"&longitude="+lons.join(",");
  const now=Date.now();
  if(FC_MEM[url]&&now-FC_MEM[url].t<FC_TTL) return FC_MEM[url].d;
  const key="fc:"+url.length+":"+lats.join(",").slice(0,60)+"|"+lons.join(",").slice(0,60)+"|"+lats.length;
  try{const c=JSON.parse(localStorage.getItem(key)||"null"); if(c&&now-c.t<FC_TTL){FC_MEM[url]=c; return c.d}}catch(e){}
  let r=null;
  for(let attempt=0;attempt<2;attempt++){
    try{ r=await fetch(url); }catch(e){ r=null }
    if(r&&r.ok) break;
    if(r&&r.status===429) throw new AppErr("eBusy");
    await new Promise(res=>setTimeout(res,1500));
  }
  if(!r||!r.ok) throw new AppErr("eForecast");
  const j=await r.json(); const d=Array.isArray(j)?j:[j];
  FC_MEM[url]={t:now,d};
  try{localStorage.setItem(key,JSON.stringify({t:now,d}))}catch(e){}
  return d;
}
/* ---- Shared forecast: data/forecast.json, refreshed every 6 hours by a GitHub Action.
   Every visitor reads the same file, so weather calls do not grow with traffic.
   Falls back to live calls only if the file is missing or older than 18 hours. ---- */
const SHARED_MAX_AGE=18*36e5;
async function loadShared(){
  const urls=["data/forecast.json"];
  const m=location.hostname.match(/^([^.]+)\.github\.io$/i), repo=location.pathname.split("/").filter(Boolean)[0];
  if(m&&repo) urls.push("https://raw.githubusercontent.com/"+m[1]+"/"+repo+"/main/data/forecast.json");
  for(const u of urls){
    try{
      const r=await fetch(u,{cache:"no-cache"}); if(!r.ok) continue;
      const j=await r.json();
      if(j&&Array.isArray(j.pts)&&j.pts.length>100&&Date.now()-Date.parse(j.generated)<SHARED_MAX_AGE) return j;
    }catch(e){}
  }

}
const sharedReady=loadShared();
function nearestRow(S,lat,lon,elev){
  let best=null,bs=1e9,bk=0;

  return {row:best,km:bk};
}
/* Same shape as an Open-Meteo answer; temperature corrected for height (0.65 °C per 100 m) */
function sharedFc(S,lat,lon,elev){
  const {row}=nearestRow(S,lat,lon,elev); if(!row) return null;
  const e=elev!=null?elev:row[2], adj=-0.0065*(e-row[2]);
  return {elevation:e,daily:{time:S.days,temperature_2m_min:row[3].map(v=>v==null?null:Math.round((v+adj)*10)/10),snowfall_sum:row[4],precipitation_sum:row[5]}};
}
const ELEV_MEM={};
async function elevations(pts){
  const key=pts.map(p=>p.lat.toFixed(3)+","+p.lon.toFixed(3)).join("|");
  if(ELEV_MEM[key]) return ELEV_MEM[key];
  try{
    const r=await fetch("https://api.open-meteo.com/v1/elevation?latitude="+pts.map(p=>p.lat.toFixed(4)).join(",")+"&longitude="+pts.map(p=>p.lon.toFixed(4)).join(","));
    const j=r.ok?await r.json():null; const e=j&&Array.isArray(j.elevation)?j.elevation:pts.map(()=>null);
    ELEV_MEM[key]=e; return e;
  }catch(e){return pts.map(()=>null)}
}
async function tripForecasts(pts){
  const S=await sharedReady;
  if(!S) return forecast(pts.map(p=>p.lat.toFixed(4)),pts.map(p=>p.lon.toFixed(4)));
  /* Named places are stored exactly; only other places need a height lookup */
  const need=pts.map(p=>nearestRow(S,p.lat,p.lon,null).km>1);
  const ask=pts.filter((p,i)=>need[i]);
  const got=ask.length?await elevations(ask):[];

}
function jsonp(url){

let QUAKES=[], TSUNAMI=null;
function parseCod(cod){
  if(!cod) return null;
  const m=cod.match(/([+-]\d+(?:\.\d+)?)([+-]\d+(?:\.\d+)?)([+-]\d+(?:\.\d+)?)?/);
  if(!m) return null;
  const toDeg=(s,max)=>{const v=parseFloat(s),a=Math.abs(v); if(a<=max) return v; const sg=v<0?-1:1,deg=Math.trunc(a/100),mn=a-deg*100; return sg*(deg+mn/60)};

}
const STRONG_JMA=["5-","5+","6-","6+","7"];
async function loadQuakes(){
  const since=Date.now()-7*864e5;
  try{
    const d=await (await fetch("https://www.jma.go.jp/bosai/quake/data/list.json")).json();
    const seen=new Set(), out=[];
    for(const ev of (Array.isArray(d)?d:[])){
      if(!ev||seen.has(ev.eid)) continue;
      const c=parseCod(ev.cod); if(!c) continue;
      const tm=Date.parse(ev.at); if(!(tm>=since)) continue;
      seen.add(ev.eid);
      const mag=parseFloat(ev.mag);
      out.push({lat:c.la,lon:c.lo,mag:isNaN(mag)?null:mag,strong:(mag>=5)||STRONG_JMA.includes(ev.maxi),time:tm,name:ev.anm||"",en:ev.en_anm||ev.anm||""});
    }
    if(out.length){QUAKES=out;return}
  }catch(e){}
  try{
    const d=await (await fetch("https://api.p2pquake.net/v2/history?codes=551&limit=100")).json();
    QUAKES=(Array.isArray(d)?d:[]).map(ev=>{
      const eq=ev.earthquake; if(!eq||!eq.hypocenter) return null;
      const h=eq.hypocenter; if(h.latitude==null||h.latitude<-90||h.longitude<-180) return null;
      const tm=Date.parse((eq.time||"").replace(/\//g,"-").replace(" ","T")+"+09:00"); if(!(tm>=since)) return null;
      const mag=h.magnitude>0?h.magnitude:null;
      return {lat:h.latitude,lon:h.longitude,mag,strong:(mag>=5)||(eq.maxScale>=45),time:tm,name:h.name||"",en:h.name||""};
    }).filter(Boolean);

}

/* ================= Assessment ================= */
function assess(place,fc,days,obs){
  const zone=place.zone||zoneFor(place.lat,place.lon,place.pref,fc&&fc.elevation);
  const months=[...new Set(days.map(d=>+d.slice(5,7)))];
  const season=Math.max(...months.map(m=>seasonLevel(zone,m)));
  const rows=[]; let fcLevel=0, covered=0;
  const idx=fc&&fc.daily?Object.fromEntries(fc.daily.time.map((x,i)=>[x,i])):{};
  for(const d of days){
    const i=idx[d];
    if(i==null){rows.push({d,lvl:null});continue}
    covered++;
    const tmin=fc.daily.temperature_2m_min[i],snow=fc.daily.snowfall_sum[i],pr=fc.daily.precipitation_sum[i];
    const lvl=dayLevel(tmin,snow,pr); fcLevel=Math.max(fcLevel,lvl??0);
    rows.push({d,tmin,snow,pr,lvl});
  }
  const R=[], P=place.short, Z=ZKEY[zone];
  if(season===2) R.push(["rSeason2",{p:P,z:Z}]); else if(season===1) R.push(["rSeason1",{p:P,z:Z}]);
  if(fcLevel===2) R.push(["rFc2",{p:P}]); else if(fcLevel===1) R.push(["rFc1",{p:P}]);
  if(covered<days.length) R.push(covered?["rPartial",{c:covered,n:days.length}]:["rBeyond",{p:P}]);
  if(fc && fc.elevation>=600) R.push(["rElev",{p:P,m:Math.round(fc.elevation)}]);

}

/* Sample terrain heights along straight lines pickup -> passes -> destination (Open-Meteo elevation API, free) */
async function buildProfile(keys){
  const segKm=[]; let D=0;
  for(let i=1;i<keys.length;i++){const k=kmBetween(keys[i-1].lat,keys[i-1].lon,keys[i].lat,keys[i].lon);segKm.push(k);D+=k}
  if(D<1) return null;
  const N=90, pts=[];
  keys[0].d=0; pts.push({lat:keys[0].lat,lon:keys[0].lon,d:0,key:0});
  let acc=0;
  for(let i=1;i<keys.length;i++){
    const n=Math.max(3,Math.round(N*segKm[i-1]/D)), a=keys[i-1], b=keys[i];
    for(let j=1;j<=n;j++){const f=j/n; pts.push({lat:a.lat+(b.lat-a.lat)*f,lon:a.lon+(b.lon-a.lon)*f,d:acc+segKm[i-1]*f,key:j===n?i:null})}
    acc+=segKm[i-1]; keys[i].d=acc;
  }
  const r=await fetch("https://api.open-meteo.com/v1/elevation?latitude="+pts.map(p=>p.lat.toFixed(4)).join(",")+"&longitude="+pts.map(p=>p.lon.toFixed(4)).join(","));
  const j=await r.json(); if(!j||!Array.isArray(j.elevation)) return null;
  pts.forEach((p,i)=>{p.e=Math.max(0,j.elevation[i]||0); if(p.key!=null) keys[p.key].e=p.e});
  return {pts,keys,D};
}
function profileSVG(pf){
  /* Labels sit in rows above the chart with thin leader lines, so nearby points never collide */
  const W=360,l=36,r=12,b=22,ih=120, gx=6;
  const tw=s=>[...s].reduce((a,c)=>a+(/[\u3000-\u9fff\u30a0-\u30ff\uff00-\uffef]/.test(c)?10:5.9),0);
  const D=pf.D, X0=l+gx, X1=W-r-gx, X=d=>X0+d/D*(X1-X0);
  const labels=pf.keys.filter(k=>!k.silent).map(k=>{const txt=shortName(k.label)+" "+Math.round(k.e||0).toLocaleString(locale())+" m", w=tw(txt), x=X(k.d);
    let x0=Math.min(Math.max(x-w/2,2),W-2-w); return {k,txt,w,x,x0}});
  const rows=[];
  labels.forEach(L=>{let ri=rows.findIndex(row=>row.every(o=>L.x0>o.x0+o.w+8||L.x0+L.w+8<o.x0)); if(ri<0){rows.push([]);ri=rows.length-1} rows[ri].push(L); L.row=ri});
  const tp=12+rows.length*13+10, H=tp+ih+b;
  const maxRaw=Math.max(...pf.pts.map(p=>p.e)), step=maxRaw>1400?500:maxRaw>600?300:100;
  const maxE=Math.max(step*2,Math.ceil(maxRaw*1.1/step)*step);
  const Y=e=>tp+(1-e/maxE)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("profTitle"))}">`;
  for(let e=0;e<=maxE;e+=step){s+=`<line class="pf-grid" x1="${l}" x2="${W-r}" y1="${Y(e)}" y2="${Y(e)}"/><text class="pf-ax" x="${l-4}" y="${Y(e)+3}" text-anchor="end">${e.toLocaleString(locale())}</text>`}
  s+=`<text class="pf-ax" x="${l-4}" y="${Y(maxE)-8}" text-anchor="end">m</text>`;
  const line=pf.pts.map(p=>X(p.d).toFixed(1)+","+Y(p.e).toFixed(1)).join(" L");
  s+=`<path class="pf-area" d="M${X(0)},${Y(0)} L${line} L${X(D)},${Y(0)} Z"/>`;
  s+=`<text class="pf-ax" x="${X0}" y="${H-6}">0 km</text><text class="pf-ax" x="${X1}" y="${H-6}" text-anchor="end">${Math.round(D).toLocaleString(locale())} km</text>`;
  labels.forEach(L=>{
    const y=Y(L.k.e||0), ly=12+L.row*13+9;
    s+=`<line class="pf-grid" x1="${L.x}" x2="${L.x}" y1="${ly+3}" y2="${y-6}" stroke-dasharray="2 2"/>`;
    s+=`<circle class="pf-dot pf-d${L.k.level}" cx="${L.x}" cy="${y}" r="5"/>`;
    s+=`<text class="pf-lbl" x="${L.x0}" y="${ly}">${esc(L.txt)}</text>`;
  });
  return s+"</svg>";
}

function render(run){
  if(run.okinawa){

    return;
  }
  const {results,passes}=run;
  const endLevel=Math.max(...results.map(r=>r.a.level));

                : `<div class="haz ok">${esc(t("hzNone"))}</div>`;
  if(level===0) h+=`<ul class="reasons"><li>${esc(t("rNone"))}</li></ul>`;
  const worst=passes.filter(x=>!x.alt&&x.a.level>endLevel).sort((a,b)=>(b.a.elev||0)-(a.a.elev||0))[0];
  if(worst) h+=`<ul class="reasons"><li>${esc(t("rPass",{v:worst.pass.name,m:Math.round(worst.a.elev||0)}))}</li></ul>`;
  if(run.profile){
    h+=`<h3>${esc(t("profTitle"))}</h3><div class="profile">${profileSVG(run.profile)}</div><p class="place">${esc(t("profNote"))}</p>`;

    if(run.auto) h+=`<p class="place">${esc(t("passNote"))}</p>`;

    for(const x of passes){
      const o=x.a.obs;
      h+=`<tr><td>${esc(x.pass.name)}${x.alt?`<br><span class="place">${esc(t("altRoad"))}</span>`:""}${o&&o.cm>=1?`<br><span class="obs">${esc(t("obsNow",{cm:o.cm}))}</span>`:""}</td><td>${x.a.elev!=null?"~"+fmt(x.a.elev," m"):"–"}</td><td>${fmt(x.a.minT," °C")}</td><td>${fmt(x.a.snowT," cm",1)}</td><td><span class="dot d${x.a.level}" title="${esc(t("lv"+x.a.level))}"></span></td></tr>`;
    }
    h+=`</tbody></table>`;
  }
  for(const r of results){
    h+=`<h3>${esc(t(r.role))}</h3><div class="place">${esc(r.place.label)}</div>`;
    if(r.a.reasons.length) h+=`<ul class="reasons">${r.a.reasons.map(([k,p])=>"<li>"+esc(t(k,rp(p)))+"</li>").join("")}</ul>`;
    h+=`<table><thead><tr><th>${esc(t("thDay"))}</th><th>${esc(t("thLow"))}</th><th>${esc(t("thSnow"))}</th><th>${esc(t("thPrecip"))}</th><th></th></tr></thead><tbody>`;
    let wk=null;
    for(const row of r.a.rows){
      const w=isoWeek(row.d);
      if(w!==wk){wk=w;h+=`<tr class="wk"><td colspan="5">${esc(t("wk",{n:w}))}</td></tr>`}
      h+=`<tr><td>${esc(fmtDay(row.d))}</td><td>${fmt(row.tmin," °C")}</td><td>${fmt(row.snow," cm",1)}</td><td>${fmt(row.pr," mm")}</td><td><span class="dot ${row.lvl==null?"dn":"d"+row.lvl}" title="${esc(row.lvl==null?t("beyond"):t("lv"+row.lvl))}"></span></td></tr>`;
    }
    h+=`</tbody></table>`;
  }
  if(level>0) h+=`<p class="place" style="margin-top:12px">${esc(t("stock"))}</p>`;
  $("out").innerHTML=h;
}

async function run(){
  $("err").textContent=""; const btn=$("go"); btn.disabled=true; btn.textContent=t("checking");
  try{
    const a=$("d1").value,b=$("d2").value;
    if(!a||!b) throw new AppErr("eDates");
    if(b<a) throw new AppErr("eOrder");
    const days=tripDays(a,b);
    const places=[{role:"pick",...(await locate($("pick").value))}];
    if($("dest").value.trim()) places.push({role:"dest",...(await locate($("dest").value))});
    for(const p of places) p.short=p.label.replace(/^〒\S+\s/,"").split(",")[0];
    const oki=places.filter(p=>p.okinawa);
    if(oki.length&&oki.length<places.length) throw new AppErr("eOkiMix");
    if(oki.length){
      lastRun={okinawa:true,places}; render(lastRun);
      tripLayer.clearLayers();
      places.forEach(p=>L.circleMarker([p.lat,p.lon],{radius:9,color:"#FB8102",weight:3,fillOpacity:0}).addTo(tripLayer));
      map.fitBounds(L.latLngBounds(places.map(p=>[p.lat,p.lon])).pad(0.6),{maxZoom:9});
      return;
    }
    let route=null, passList=[], altSet=new Set();
    if($("route").checked&&places.length===2){
      route=routeTrip(places[0],places[1]);
      if(route){ passList=[...route.passes,...route.alt]; route.alt.forEach(p=>altSet.add(p)) }
      /* no road link (e.g. Hokkaido to Honshu needs a ferry): ends are still checked, no passes */
    }
    const auto=passList.length>0;
    const pts=[...places,...passList];
    const [fcs]=await Promise.all([tripForecasts(pts),loadAmedas(),hazReady]);
    /* Snow on the ground now only matters for trips starting within the next 3 days */
    const useObs=days[0]<=addDays(jpToday(),3);
    const obsFor=(p,fc)=>useObs?nearestObs(p,fc&&fc.elevation):null;
    const results=places.map((p,i)=>({role:p.role,place:p,a:assess(p,fcs[i],days,obsFor(p,fcs[i]))}));
    const passes=passList.map((ps,j)=>{const fc=fcs[places.length+j]; return {pass:ps,alt:altSet.has(ps),a:assess({...ps,short:ps.name},fc,days,obsFor(ps,fc))}});
    lastRun={results,passes,auto};
    render(lastRun);
    setTimeout(()=>map.invalidateSize(),0);
    const pick=results[0], dest=results.find(x=>x.role==="dest");
    if(route&&dest){
      const lvlOf=p=>{const x=passes.find(y=>y.pass===p); return x?x.a.level:0};
      const mid=route.line.slice(1,-1).map(q=>q.pass?{lat:q.lat,lon:q.lon,label:q.pass.name,level:lvlOf(q.pass)}:{lat:q.lat,lon:q.lon,silent:true});
      const keys=[{lat:pick.place.lat,lon:pick.place.lon,label:pick.place.short,level:pick.a.level},...mid,
        {lat:dest.place.lat,lon:dest.place.lon,label:dest.place.short,level:dest.a.level}];
      const thisRun=lastRun;
      buildProfile(keys).then(pf=>{ if(pf&&lastRun===thisRun){ lastRun.profile=pf; render(lastRun) } }).catch(()=>{});
    }
    tripLayer.clearLayers();
    places.forEach(p=>L.circleMarker([p.lat,p.lon],{radius:9,color:"#FB8102",weight:3,fillOpacity:0}).addTo(tripLayer));
    passList.forEach(p=>L.circleMarker([p.lat,p.lon],{radius:11,color:"#FB8102",weight:2,dashArray:"3 3",fillOpacity:0,opacity:altSet.has(p)?.5:1}).addTo(tripLayer));
    if(route) L.polyline(route.line.map(q=>[q.lat,q.lon]),{color:"#FB8102",weight:3,opacity:.8}).addTo(tripLayer);
    map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lon])).pad(0.6),{maxZoom:9});
  }catch(e){$("err").textContent=errText(e); $("out").innerHTML=""; lastRun=null; tripLayer.clearLayers()}
  finally{btn.disabled=false;btn.textContent=t("check")}
}

/* ---- Calendar with ISO calendar weeks (CW/KW) on the left; weeks start Monday ---- */
let calFor=null, calMonth=null, calMode="start";
const fmtLong=s=>new Date(s+"T00:00:00").toLocaleDateString(locale(),s.slice(0,4)===jpToday().slice(0,4)?{weekday:"short",month:"short",day:"numeric"}:{weekday:"short",year:"numeric",month:"short",day:"numeric"});
function paintDates(){
  for(const id of ["d1","d2"]){const v=$(id).value;
    $(id+"b").innerHTML=v?`<span>${esc(fmtLong(v))}</span><span class="cw">${esc(t("cwShort"))} ${isoWeek(v)}</span>`:"–"}
}
function openCal(id){
  calFor=id; calMode=id==="d2"?"end":"start"; calMonth=($(id).value||jpToday()).slice(0,7);
  const c=$("cal"); $(id+"b").parentElement.appendChild(c);
  c.style.left=id==="d2"?"auto":"0"; c.style.right=id==="d2"?"0":"auto";
  c.hidden=false; drawCal();
}
function closeCal(){ $("cal").hidden=true; calFor=null }
function drawCal(){
  const [y,m]=calMonth.split("-").map(Number), first=new Date(y,m-1,1);
  const d=new Date(y,m-1,1-((first.getDay()+6)%7));
  const min=jpToday();  /* any day from today in Japan */
  const a=$("d1").value,b=$("d2").value,td=jpToday();
  const wd=[...Array(7)].map((_,i)=>new Date(2026,0,5+i).toLocaleDateString(locale(),{weekday:"narrow"}));
  let h=`<div class="cal-h"><button type="button" data-nav="-1" aria-label="${esc(t("prevMonth"))}">‹</button><span>${esc(first.toLocaleDateString(locale(),{year:"numeric",month:"long"}))}</span><button type="button" data-nav="1" aria-label="${esc(t("nextMonth"))}">›</button></div>`;
  h+=`<table><thead><tr><th class="cw">${esc(t("cwShort"))}</th>${wd.map(w=>`<th>${esc(w)}</th>`).join("")}</tr></thead><tbody>`;
  for(let r=0;r<6;r++){
    h+=`<tr><td class="cw">${isoWeek(iso(d))}</td>`;
    for(let c=0;c<7;c++){
      const s=iso(d), ends=(s===a||s===b), cls=[d.getMonth()!==m-1?"out":"", ends?"sel":"", (a&&b&&s>a&&s<b)?"inr":"", s===td?"today":""].join(" ").trim();
      h+=`<td><button type="button" data-day="${s}" class="${cls}" ${s<min?"disabled":""}>${d.getDate()}</button></td>`;
      d.setDate(d.getDate()+1);
    }
    h+="</tr>";
    if(d.getFullYear()*12+d.getMonth()>y*12+m-1) break;
  }
  $("cal").innerHTML=h+`</tbody></table><div class="cal-f">${esc(t(calMode==="start"?"pickFirst":"pickLast"))}</div>`;
}
$("cal").addEventListener("click",e=>{
  const n=e.target.closest("[data-nav]");
  if(n){const [y,m]=calMonth.split("-").map(Number); calMonth=iso(new Date(y,m-1+(+n.dataset.nav),1)).slice(0,7); drawCal(); return}
  const b=e.target.closest("[data-day]");
  if(b&&!b.disabled){
    const day=b.dataset.day;
    if(calMode==="start"||day<$("d1").value){
      /* new start: keep the trip length if the end would now be before the start */
      $("d1").value=day; if(!$("d2").value||$("d2").value<day) $("d2").value=day;
      calMode="end"; syncDates(null); drawCal();
    } else {
      $("d2").value=day; const id=calFor; closeCal(); syncDates(null); $(id+"b").focus();
    }
  }
});
["d1","d2"].forEach(id=>$(id+"b").addEventListener("click",()=>{ if(calFor===id&&!$("cal").hidden) closeCal(); else openCal(id) }));
document.addEventListener("click",e=>{ if(!$("cal").hidden&&!e.composedPath().some(n=>n.classList&&(n.classList.contains("cal")||n.classList.contains("datebtn")))) closeCal() });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("cal").hidden){const id=calFor; closeCal(); $(id+"b").focus()} });
function syncDates(changed){
  const td=jpToday();
  if($("d1").value&&$("d1").value<td) $("d1").value=td;
  const a=$("d1").value;
  if(changed==="d1"&&a){ if(!$("d2").value||$("d2").value<a) $("d2").value=addDays(a,tripLen) }
  if(changed==="d2"&&a&&$("d2").value&&$("d2").value<a) $("d2").value=a;
  $("d1").min=td; $("d2").min=a||td;
  if(a&&$("d2").value) tripLen=Math.round((new Date($("d2").value)-new Date(a))/864e5);
  showWeeks(); paintDates(); drawOverview();
}
$("d1").addEventListener("change",()=>syncDates("d1"));
$("d2").addEventListener("change",()=>syncDates("d2"));
$("d1").min=jpToday(); $("d2").min=$("d1").value; paintDates();
/* Japan clock under the dates; also rolls the minimum date over at midnight in Japan */
function tickJP(){
  $("jptime").textContent=t("jpTime",{d:new Date().toLocaleString(locale(),{timeZone:JP_TZ,weekday:"short",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})});
  const td=jpToday(); $("d1").min=td; if($("d1").value&&$("d1").value<td) syncDates("d1");
}
tickJP(); setInterval(tickJP,60000);
setLang(detectLang());
drawOverview();
</script>
</body>
</html>
